<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Default"/>

<f:section name="Main">
    <div class="orcid-citations" id="orcid-citations-{uid}">
        <noscript>Please enable JavaScript to render citations.</noscript>

        <p class="orcid-citations__empty" hidden>
            {f:translate(key:'orcid.notFound', default:'ORCID Datensatz nicht gefunden')}
        </p>
    </div>

    <script type="application/json" id="orcid-payload-{uid}">
        {groupsJson -> f:format.raw()}
    </script>
</f:section>

</html>
